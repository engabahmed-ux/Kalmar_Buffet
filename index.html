<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kalmar Reachstacker - لعبة بوفيه كالمر</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #11141a; color: #fff; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #game-canvas { background: #262c36; border: 3px solid #d31b23; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); max-width: 98vw; max-height: 75vh; }
        
        /* واجهة التعليمات العلوية */
        #hud { position: absolute; top: 12px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
        .hud-card { background: rgba(15, 20, 30, 0.9); border: 2px solid #d31b23; border-radius: 10px; padding: 8px 18px; pointer-events: auto; }
        .hud-title { font-size: 11px; color: #aaa; }
        .hud-val { font-size: 16px; font-weight: bold; color: #ffeb3b; }

        /* أزرار اللمس والتحكم */
        #touch-controls { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; z-index: 10; pointer-events: none; }
        .dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 58px); gap: 6px; pointer-events: auto; }
        .btn { background: #1e2638; border: 2px solid #3e4d66; color: #fff; font-size: 22px; font-weight: bold; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn:active, .btn.active { background: #d31b23; border-color: #ff5252; transform: scale(0.92); }
        
        #action-btn { width: 140px; height: 65px; border-radius: 14px; background: #d31b23; border: 2px solid #ff5252; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; pointer-events: auto; }
        #action-btn:active { background: #99141a; transform: scale(0.92); }

        #win-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111a24; border: 3px solid #00e676; border-radius: 16px; padding: 25px 40px; text-align: center; display: none; z-index: 30; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-card">
            <div class="hud-title">🍹 طلب المشروب المطلوب</div>
            <div class="hud-val">طاولة 2: ركن العصائر والموهيتو (الخضراء)</div>
        </div>
        <div class="hud-card" style="text-align: center;">
            <div class="hud-title">حالة الحاوية</div>
            <div class="hud-val" id="status-text" style="color: #ff9800;">اقترب من الحاوية لالتقاطها</div>
        </div>
    </div>

    <canvas id="game-canvas" width="900" height="600"></canvas>

    <div id="touch-controls">
        <div class="dpad">
            <div></div>
            <button class="btn" id="b-up">▲</button>
            <div></div>
            <button class="btn" id="b-left">◀</button>
            <button class="btn" id="b-down">▼</button>
            <button class="btn" id="b-right">▶</button>
        </div>

        <button id="action-btn" onclick="triggerAction()">📦 التقاط الحاوية</button>
    </div>

    <div id="win-modal">
        <h2 style="color: #00e676; margin-bottom: 8px;">🎉 تم تسليم الطلب بنجاح!</h2>
        <p style="color: #ddd; margin-bottom: 15px;">استمتع بمشروبك في ضيافة شركة كالمر!</p>
        <button class="btn" style="padding: 8px 20px; margin: 0 auto; font-size: 15px; background: #00e676; color: #000;" onclick="location.reload()">إعادة اللعب 🔄</button>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // حالة المعدة واللعبة
        let truck = { x: 450, y: 480, angle: -Math.PI / 2, speed: 0, steer: 0 };
        let cargo = { x: 450, y: 280, isAttached: false, isDelivered: false };
        let keys = { up: false, down: false, left: false, right: false };

        const TABLES = [
            { id: 1, name: "قهوة ساخنة", color: "#1976d2", x: 180, y: 120, w: 140, h: 70 },
            { id: 2, name: "عصائر وموهيتو (الهدف)", color: "#388e3c", x: 450, y: 120, w: 140, h: 70, target: true },
            { id: 3, name: "مشروبات مثلجة", color: "#f57c00", x: 720, y: 120, w: 140, h: 70 }
        ];

        // الاستماع للوحة المفاتيح
        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup' || k === 'ص') keys.up = true;
            if (k === 's' || k === 'arrowdown' || k === 'س') keys.down = true;
            if (k === 'a' || k === 'arrowleft' || k === 'ش') keys.left = true;
            if (k === 'd' || k === 'arrowright' || k === 'ي') keys.right = true;
            if (e.code === 'Space' || k === 'e' || k === 'ث') triggerAction();
        });

        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup' || k === 'ص') keys.up = false;
            if (k === 's' || k === 'arrowdown' || k === 'س') keys.down = false;
            if (k === 'a' || k === 'arrowleft' || k === 'ش') keys.left = false;
            if (k === 'd' || k === 'arrowright' || k === 'ي') keys.right = false;
        });

        // ربط أزرار اللمس
        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            const start = () => { keys[key] = true; el.classList.add('active'); };
            const end = () => { keys[key] = false; el.classList.remove('active'); };
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); start(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); end(); });
        };
        bindTouch('b-up', 'up');
        bindTouch('b-down', 'down');
        bindTouch('b-left', 'left');
        bindTouch('b-right', 'right');

        function triggerAction() {
            if (cargo.isDelivered) return;

            // حساب المسافة بين مقدمة ونش كالمر والحاوية
            const spreaderX = truck.x + Math.cos(truck.angle) * 75;
            const spreaderY = truck.y + Math.sin(truck.angle) * 75;
            const distToCargo = Math.hypot(spreaderX - cargo.x, spreaderY - cargo.y);

            if (!cargo.isAttached) {
                if (distToCargo < 70) {
                    cargo.isAttached = true;
                    document.getElementById('status-text').innerText = "محمولة بنجاح! توجّه للطاولة الخضراء";
                    document.getElementById('status-text').style.color = "#00e676";
                    document.getElementById('action-btn').innerText = "⬇️ إنزال الحاوية";
                }
            } else {
                // فحص الوصول لطاولة العصائر رقم 2
                const targetTable = TABLES[1];
                const distToTable = Math.hypot(cargo.x - targetTable.x, cargo.y - targetTable.y);

                if (distToTable < 80) {
                    cargo.isAttached = false;
                    cargo.isDelivered = true;
                    cargo.x = targetTable.x;
                    cargo.y = targetTable.y;
                    document.getElementById('status-text').innerText = "✅ تم تسليم الطلب بنجاح!";
                    document.getElementById('win-modal').style.display = 'block';
                } else {
                    cargo.isAttached = false;
                    document.getElementById('status-text').innerText = "تم الإنزال! اقترب واضغط لالتقاطها";
                    document.getElementById('status-text').style.color = "#ff9800";
                    document.getElementById('action-btn').innerText = "📦 التقاط الحاوية";
                }
            }
        }

        function update() {
            // معالجة الحركة
            if (keys.up) truck.speed = Math.min(truck.speed + 0.3, 3.8);
            else if (keys.down) truck.speed = Math.max(truck.speed - 0.3, -2.5);
            else truck.speed *= 0.88;

            if (keys.left) truck.angle -= 0.045;
            if (keys.right) truck.angle += 0.045;

            truck.x += Math.cos(truck.angle) * truck.speed;
            truck.y += Math.sin(truck.angle) * truck.speed;

            // حدود الشاشة
            truck.x = Math.max(40, Math.min(canvas.width - 40, truck.x));
            truck.y = Math.max(40, Math.min(canvas.height - 40, truck.y));

            // تحديث موقع الحاوية المحمولة
            if (cargo.isAttached) {
                cargo.x = truck.x + Math.cos(truck.angle) * 75;
                cargo.y = truck.y + Math.sin(truck.angle) * 75;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. رسم خطوط الساحة الأرضية
            ctx.strokeStyle = '#374151';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // 2. رسم طاولات البوفيه (الحاويات الأفقية)
            TABLES.forEach(t => {
                ctx.save();
                ctx.translate(t.x, t.y);

                // ظل الطاولة
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(-t.w / 2 + 5, -t.h / 2 + 5, t.w, t.h);

                // جسم طاولة البوفيه
                ctx.fillStyle = t.color;
                ctx.fillRect(-t.w / 2, -t.h / 2, t.w, t.h);

                // إطار مضيء للهدف
                if (t.target) {
                    ctx.strokeStyle = '#ffeb3b';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(-t.w / 2 - 2, -t.h / 2 - 2, t.w + 4, t.h + 4);
                }

                // اسم الطاولة
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px Tahoma';
                ctx.textAlign = 'center';
                ctx.fillText(t.name, 0, 5);

                ctx.restore();
            });

            // 3. رسم حاوية الطلب
            ctx.save();
            ctx.translate(cargo.x, cargo.y);
            if (cargo.isAttached) ctx.rotate(truck.angle);

            // ظل الحاوية
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fillRect(-22, -45, 44, 90);

            // جسم الحاوية الحمراء
            ctx.fillStyle = '#d31b23';
            ctx.fillRect(-20, -48, 40, 96);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(-20, -48, 40, 96);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('KALMAR', 0, 4);

            ctx.restore();

            // 4. رسم ونش Kalmar Reachstacker
            ctx.save();
            ctx.translate(truck.x, truck.y);
            ctx.rotate(truck.angle);

            // ظل الشاحنة
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-45, -28, 90, 56);

            // العجلات الأربع
            ctx.fillStyle = '#111';
            ctx.fillRect(-38, -32, 22, 9);
            ctx.fillRect(20, -32, 22, 9);
            ctx.fillRect(-38, 23, 22, 9);
            ctx.fillRect(20, 23, 22, 9);

            // الشاسيه الأحمر لكالمر
            ctx.fillStyle = '#d31b23';
            ctx.fillRect(-40, -25, 80, 50);

            // الثقل الخلفي مع خطوط الأمان
            ctx.fillStyle = '#99141a';
            ctx.fillRect(-40, -25, 18, 50);

            // كابينة السائق الزجاجية
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-10, -18, 26, 36);

            // الذراع الهيدروليكي (Boom) ممتد للأمام
            ctx.fillStyle = '#111827';
            ctx.fillRect(5, -7, 68, 14);

            // الماسكة (Spreader)
            ctx.fillStyle = '#374151';
            ctx.fillRect(70, -28, 10, 56);

            // أذرع الإرشاد الصفراء على أطراف الماسك
            ctx.fillStyle = '#ffeb3b';
            ctx.fillRect(68, -30, 14, 5);
            ctx.fillRect(68, 25, 14, 5);

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
